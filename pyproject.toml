[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-match-finder"
version = "0.1.0"
description = "Find overlapping fragments across a video collection (partial near-duplicate detection)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "video-match-finder contributors" }]
keywords = ["video", "near-duplicate", "copy-detection", "dinov2", "faiss"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    # torch and torchvision are intentionally NOT listed here. PyPI's default
    # torch wheel is the newest CUDA build (currently cu130, requiring driver
    # ≥ 580), which would silently upgrade and break installs on hosts with
    # older drivers or pre-installed torch builds. Install torch separately
    # (run `vmf install-torch` after this package for automatic detection),
    # or pick a wheel manually from https://pytorch.org/get-started/locally/.
    "numpy>=1.24",
    "faiss-cpu>=1.7.4",
    "Pillow>=10.0",
    "psutil>=5.9",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Convenience extras. Most users should install torch separately to match
# their CUDA / driver version (see `vmf install-torch`).
torch-cpu = ["torch>=2.4", "torchvision>=0.19"]
gpu = ["faiss-gpu>=1.7.4"]
serve = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
vmf = "vmf.cli:app"

[project.urls]
Homepage = "https://github.com/sinoosoida/video-match-finder"
Issues = "https://github.com/sinoosoida/video-match-finder/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
